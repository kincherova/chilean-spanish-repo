<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Survival Chilean Spanish</title>
    <script>
      var l = window.location;
      var base = '/survival-chilean-spanish-2';
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        base + '/?p=' + l.pathname.slice(base.length).replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
