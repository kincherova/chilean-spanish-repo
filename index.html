<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon_192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Survival Chilean Spanish - Learn Before You Land</title>
    <meta name="description" content="Master essential Chilean Spanish through short, focused lessons designed for busy travelers." />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Chilean Spanish" />
    <link rel="apple-touch-icon" href="/icon_192x192.png" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      (function() {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
        var search = location.search;
        if (search) {
          var p = new URLSearchParams(search);
          var path = p.get('p');
          if (path) {
            var newPath = path.replace(/~and~/g, '&');
            var newSearch = p.get('q') ? '?' + p.get('q').replace(/~and~/g, '&') : '';
            var hash = location.hash;
            history.replaceState(null, null, newPath + newSearch + hash);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
